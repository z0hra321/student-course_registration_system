name: Build LaTeX Report PDF

on:
  push:
    paths:
      - 'report.tex'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:  # Allows manual triggering
  pull_request:
    paths:
      - 'report.tex'

permissions:
  contents: write  # Required to commit PDF

jobs:
  build-latex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
      
    - name: Setup TeX Live
      uses: tecosaur/setup-tex@v1
      with:
        distribution: 'full'
        
    - name: Install additional packages
      run: |
        tlmgr update --self
        tlmgr install algorithms algorithmicx pgf
        
    - name: Compile LaTeX to PDF
      working-directory: ${{ github.workspace }}
      run: |
        pdflatex -interaction=nonstopmode -halt-on-error report.tex || true
        pdflatex -interaction=nonstopmode -halt-on-error report.tex || true
        pdflatex -interaction=nonstopmode -halt-on-error report.tex || true
        
    - name: Check if PDF was generated
      run: |
        if [ ! -f report.pdf ]; then
          echo "Error: PDF was not generated!"
          echo "Checking for error logs..."
          ls -la *.log *.aux 2>/dev/null || true
          exit 1
        fi
        echo "PDF generated successfully!"
        ls -lh report.pdf
        
    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: report-pdf
        path: report.pdf
        retention-days: 90
        
    - name: Commit and push PDF
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add report.pdf || true
        if git diff --staged --quiet; then
          echo "No changes to commit (PDF already exists or unchanged)"
        else
          git commit -m "Auto-generate PDF from LaTeX report [skip ci]" || echo "Commit failed, but continuing"
          git push || echo "Push failed, but continuing"
        fi
